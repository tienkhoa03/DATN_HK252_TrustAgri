worker_processes auto;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/json;

    # ─── UPSTREAM — dùng Railway internal hostname ──────────────────────────
    upstream auth_service        { server auth-service.railway.internal:3001; keepalive 16; }
    upstream notification_service { server notification-service.railway.internal:3002; keepalive 16; }
    upstream farm_service        { server farm-service.railway.internal:3003; keepalive 16; }
    upstream contract_service    { server contract-service.railway.internal:3004; keepalive 16; }
    upstream monitoring_service  { server monitoring-service.railway.internal:3005; keepalive 16; }

    limit_req_zone $binary_remote_addr zone=api_general:10m rate=600r/m;
    limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=60r/m;
    limit_req_status 429;

    server {
        listen 80;
        server_name _;

        add_header X-Request-Id $request_id always;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # ─── AUTH ─────────────────────────────────────────────────────────────
        location /api/v1/auth {
            limit_req zone=api_auth burst=10 nodelay;
            proxy_pass http://auth_service;
        }

        # ─── FARM ─────────────────────────────────────────────────────────────
        location /api/v1/farms       { limit_req zone=api_general burst=200 nodelay; proxy_pass http://farm_service; }
        location /api/v1/standards   { limit_req zone=api_general burst=200 nodelay; proxy_pass http://farm_service; }
        location /api/v1/traceability { limit_req zone=api_general burst=80 nodelay; proxy_pass http://farm_service; }

        # ─── CONTRACT ─────────────────────────────────────────────────────────
        location /api/v1/products         { limit_req zone=api_general burst=200 nodelay; proxy_pass http://contract_service; }
        location /api/v1/buying-requests  { limit_req zone=api_general burst=200 nodelay; proxy_pass http://contract_service; }
        location /api/v1/orders           { limit_req zone=api_general burst=200 nodelay; proxy_pass http://contract_service; }
        location /api/v1/proposals        { limit_req zone=api_general burst=200 nodelay; proxy_pass http://contract_service; }
        location /api/v1/contracts        { limit_req zone=api_general burst=200 nodelay; proxy_pass http://contract_service; }
        location /api/v1/connections      { limit_req zone=api_general burst=200 nodelay; proxy_pass http://contract_service; }
        location /api/v1/traders          { limit_req zone=api_general burst=200 nodelay; proxy_pass http://contract_service; }
        location /api/v1/farmers          { limit_req zone=api_general burst=200 nodelay; proxy_pass http://contract_service; }
        location /api/v1/dashboard        { limit_req zone=api_general burst=200 nodelay; proxy_pass http://contract_service; }

        # ─── MONITORING (REST) ────────────────────────────────────────────────
        location /api/v1/monitoring { limit_req zone=api_general burst=200 nodelay; proxy_pass http://monitoring_service; }

        # ─── MONITORING (WebSocket) ───────────────────────────────────────────
        location /ws/monitoring {
            proxy_pass http://monitoring_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ─── NOTIFICATION ─────────────────────────────────────────────────────
        location /api/v1/notifications { limit_req zone=api_general burst=200 nodelay; proxy_pass http://notification_service; }
        location /api/v1/news          { limit_req zone=api_general burst=200 nodelay; proxy_pass http://notification_service; }
        location /api/v1/forecasts     { limit_req zone=api_general burst=200 nodelay; proxy_pass http://notification_service; }

        # ─── HEALTH ──────────────────────────────────────────────────────────
        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
        }

        location / {
            return 404 '{"error":{"code":"NOT_FOUND","message":"Endpoint không tồn tại"}}';
        }
    }
}