worker_processes auto;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/json;

    # ─── DNS RESOLVER (Railway private network) ─────────────────────────────
    # nginx cache IP của upstream theo vòng đời process. Trên Railway mỗi lần
    # service redeploy sẽ nhận IP nội bộ MỚI → nếu dùng `upstream { server ... }`
    # tĩnh, nginx giữ IP cũ (đã chết) → 502/504 cho service vừa deploy.
    # Cách khắc phục: resolver nội bộ Railway (fd12::10, cố định) + truyền hostname
    # qua BIẾN trong proxy_pass để nginx re-resolve mỗi request (TTL 10s).
    resolver [fd12::10] valid=10s ipv6=on;
    resolver_timeout 5s;

    limit_req_zone $binary_remote_addr zone=api_general:10m rate=600r/m;
    limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=60r/m;
    limit_req_status 429;

    server {
        listen 80;
        server_name _;

        # Hostname upstream đặt qua biến → buộc nginx dùng resolver (không cache lúc startup).
        set $auth_upstream         auth-service.railway.internal:3001;
        set $notification_upstream notification-service.railway.internal:3002;
        set $farm_upstream         farm-service.railway.internal:3003;
        set $contract_upstream     contract-service.railway.internal:3004;
        set $monitoring_upstream   monitoring-service.railway.internal:3005;

        add_header X-Request-Id $request_id always;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # ─── AUTH ─────────────────────────────────────────────────────────────
        location /api/v1/auth {
            limit_req zone=api_auth burst=10 nodelay;
            proxy_pass http://$auth_upstream;
        }

        # ─── FARM ─────────────────────────────────────────────────────────────
        location /api/v1/farms        { limit_req zone=api_general burst=200 nodelay; proxy_pass http://$farm_upstream; }
        location /api/v1/standards    { limit_req zone=api_general burst=200 nodelay; proxy_pass http://$farm_upstream; }
        location /api/v1/traceability { limit_req zone=api_general burst=80  nodelay; proxy_pass http://$farm_upstream; }

        # ─── CONTRACT ─────────────────────────────────────────────────────────
        location /api/v1/products         { limit_req zone=api_general burst=200 nodelay; proxy_pass http://$contract_upstream; }
        location /api/v1/buying-requests  { limit_req zone=api_general burst=200 nodelay; proxy_pass http://$contract_upstream; }
        location /api/v1/orders           { limit_req zone=api_general burst=200 nodelay; proxy_pass http://$contract_upstream; }
        location /api/v1/proposals        { limit_req zone=api_general burst=200 nodelay; proxy_pass http://$contract_upstream; }
        location /api/v1/contracts        { limit_req zone=api_general burst=200 nodelay; proxy_pass http://$contract_upstream; }
        location /api/v1/connections      { limit_req zone=api_general burst=200 nodelay; proxy_pass http://$contract_upstream; }
        location /api/v1/traders          { limit_req zone=api_general burst=200 nodelay; proxy_pass http://$contract_upstream; }
        location /api/v1/farmers          { limit_req zone=api_general burst=200 nodelay; proxy_pass http://$contract_upstream; }
        location /api/v1/dashboard        { limit_req zone=api_general burst=200 nodelay; proxy_pass http://$contract_upstream; }

        # ─── MONITORING (REST) ────────────────────────────────────────────────
        location /api/v1/monitoring { limit_req zone=api_general burst=200 nodelay; proxy_pass http://$monitoring_upstream; }

        # ─── MONITORING (WebSocket) ───────────────────────────────────────────
        location /ws/monitoring {
            proxy_pass http://$monitoring_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ─── NOTIFICATION ─────────────────────────────────────────────────────
        location /api/v1/notifications { limit_req zone=api_general burst=200 nodelay; proxy_pass http://$notification_upstream; }
        location /api/v1/news          { limit_req zone=api_general burst=200 nodelay; proxy_pass http://$notification_upstream; }
        location /api/v1/forecasts     { limit_req zone=api_general burst=200 nodelay; proxy_pass http://$notification_upstream; }

        # ─── HEALTH ──────────────────────────────────────────────────────────
        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
        }

        location / {
            return 404 '{"error":{"code":"NOT_FOUND","message":"Endpoint không tồn tại"}}';
        }
    }
}
